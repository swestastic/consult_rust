[package]
name = "consult-rust"
version = "1.0.1"
edition = "2024"
description = "Cross-platform Nissan Consult (OBD-I) diagnostic tool"
authors = ["Kyle Corbett"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = "0.15"

[profile.release]
lto = true
